<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ncm-nowplaying overlay</title>
<style>
  :root {
    --font: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    --active: rgba(255, 255, 255, .98);
    --dim: rgba(255, 255, 255, .56);
    --muted: rgba(255, 255, 255, .38);
    --accent: #ff6078;
    --shadow: 0 2px 12px rgba(0, 0, 0, .38);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    font-family: var(--font);
    background: transparent;      /* drops straight into an OBS browser source */
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 0;
  }
  #panel {
    width: min(860px, 100%);
    height: min(206px, 100vh);
    padding: clamp(15px, 2.8vw, 24px) clamp(17px, 3.2vw, 28px);
    border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 20px;
    background:
      linear-gradient(120deg, rgba(12, 17, 29, .76), rgba(16, 22, 35, .48));
    box-shadow:
      0 18px 50px rgba(0, 0, 0, .3),
      inset 0 1px 0 rgba(255, 255, 255, .08);
    -webkit-backdrop-filter: blur(18px) saturate(125%);
    backdrop-filter: blur(18px) saturate(125%);
    overflow: hidden;
  }
  #meta {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .01em;
    color: var(--muted);
    margin-bottom: 12px;
    white-space: nowrap;
    overflow: hidden;
  }
  #meta::before {
    content: "";
    width: 6px;
    height: 6px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(255, 96, 120, .14);
  }
  #meta:empty { display: none; }
  #meta b {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    color: rgba(255, 255, 255, .88);
    font-weight: 650;
  }
  #meta .artist {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #meta .paused {
    flex: 0 0 auto;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255, 96, 120, .14);
    color: #ff9bab;
    font-size: 11px;
  }
  #lines { display: flex; flex-direction: column; gap: 7px; }
  .line {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
    overflow: hidden;
    font-size: clamp(17px, 3.5vw, 27px);
    font-weight: 550;
    line-height: 1.25;
    white-space: nowrap;
    color: var(--dim);
    text-shadow: var(--shadow);
    transition: color .25s ease, opacity .25s ease, transform .25s ease;
    opacity: .58;
  }
  .line.cur {
    color: var(--active);
    font-size: clamp(23px, 4.6vw, 36px);
    font-weight: 720;
    letter-spacing: -.015em;
    opacity: 1;
  }
  .lyric-text {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  /* Word-level fill: base colour is dim, a gradient paints the sung part active. */
  .line.cur .lyric-text.karaoke {
    background-image: linear-gradient(to right, var(--active) var(--fill, 0%), var(--dim) var(--fill, 0%));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #offline {
    color: rgba(255, 255, 255, .7);
    font-size: 14px;
    text-shadow: var(--shadow);
  }

  @media (max-height: 260px) {
    #panel { padding: 13px 16px; border-radius: 16px; }
    #meta { margin-bottom: 8px; }
    #lines { gap: 5px; }
  }
</style>
</head>
<body>
  <main id="panel" hidden>
    <div id="meta"></div>
    <div id="lines"></div>
    <div id="offline" hidden>Waiting for NetEase Cloud Music…</div>
  </main>

<script>
"use strict";

const panelEl = document.getElementById("panel");
const metaEl = document.getElementById("meta");
const linesEl = document.getElementById("lines");
const offlineEl = document.getElementById("offline");

// The server only pushes on whole-second ticks. Interpolate locally against the wall
// clock so word-level highlighting does not advance in visible steps.
let clock = { positionMs: 0, at: performance.now(), playing: false };
let lyrics = null;
let renderedKey = "";

function nowMs() {
  if (!clock.playing) return clock.positionMs;
  return clock.positionMs + (performance.now() - clock.at);
}

function setClock(positionMs, playing) {
  clock = { positionMs: positionMs || 0, at: performance.now(), playing: !!playing };
}

function updatePaused(playing) {
  const paused = metaEl.querySelector(".paused");
  if (!playing && !paused && metaEl.textContent) {
    const tag = document.createElement("span");
    tag.className = "paused";
    tag.textContent = "⏸";
    metaEl.appendChild(tag);
  } else if (playing && paused) {
    paused.remove();
  }
}

function applySnapshot(d) {
  panelEl.hidden = false;
  offlineEl.hidden = !!d.song;
  lyrics = d.lyrics && d.lyrics.lines && d.lyrics.lines.length ? d.lyrics : null;
  setClock(d.positionMs, d.playing);

  if (d.song) {
    const artists = (d.song.artists || []).join(" / ");
    metaEl.innerHTML = "<b></b><span class=\"artist\"></span>";
    metaEl.querySelector("b").textContent = d.song.name;
    metaEl.querySelector(".artist").textContent = artists ? "—  " + artists : "";
  } else {
    metaEl.textContent = "";
  }
  updatePaused(d.playing);
  renderedKey = "";
  paint(true);
}

function lineIndexAt(pos) {
  if (!lyrics) return -1;
  const ls = lyrics.lines;
  let lo = 0, hi = ls.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (ls[mid].time <= pos) { found = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return found;
}

// How much of the current line has been sung: yrc uses per-word timings, lrc falls
// back to a linear sweep across the whole line.
function fillPercent(line, pos) {
  if (!line) return 0;
  if (line.words && line.words.length) {
    let done = 0, total = 0, cursor = 0;
    for (const w of line.words) {
      total += w.text.length;
      if (pos >= w.time + w.duration) cursor += w.text.length;
      else if (pos > w.time) cursor += w.text.length * ((pos - w.time) / Math.max(w.duration, 1));
    }
    done = cursor;
    return total ? Math.min(100, (done / total) * 100) : 0;
  }
  if (!line.duration) return 0;
  return Math.max(0, Math.min(100, ((pos - line.time) / line.duration) * 100));
}

// Keep the overlay to three visible original-lyric rows. Translations are
// intentionally omitted from the OBS overlay.
function visibleRows(idx) {
  const ls = lyrics.lines;
  if (idx < 0) {
    return ls.slice(0, 3).map((_, i) => i);
  }

  const start = Math.max(0, Math.min(idx - 1, ls.length - 3));
  return ls.slice(start, start + 3).map((_, offset) => start + offset);
}

function paint(force) {
  const pos = nowMs();

  if (!lyrics) {
    if (force) linesEl.innerHTML = "";
    return;
  }

  const idx = lineIndexAt(pos);
  const rows = visibleRows(idx);
  const key = rows.join(",");

  if (force || key !== renderedKey) {
    renderedKey = key;
    linesEl.innerHTML = "";
    for (const row of rows) {
      const line = lyrics.lines[row];
      const div = document.createElement("div");
      div.className = "line" + (row === idx ? " cur" : "");
      div.dataset.i = String(row);

      const original = document.createElement("span");
      original.className = "lyric-text" + (row === idx ? " karaoke" : "");
      original.textContent = line.text;
      div.appendChild(original);

      linesEl.appendChild(div);
    }
  }

  const cur = linesEl.querySelector(".line.cur .lyric-text.karaoke");
  if (cur) cur.style.setProperty("--fill", fillPercent(lyrics.lines[idx], pos).toFixed(2) + "%");
}

function loop() { paint(false); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "snapshot" || msg.type === "musicchange") {
      applySnapshot(msg.data);
    } else if (msg.type === "timechange") {
      setClock(msg.positionMs, msg.playing);
      updatePaused(msg.playing);
    } else if (msg.type === "idle") {
      lyrics = null;
      metaEl.textContent = "";
      linesEl.innerHTML = "";
      panelEl.hidden = false;
      offlineEl.hidden = false;
    }
  };

  ws.onclose = () => {
    panelEl.hidden = false;
    offlineEl.hidden = false;
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
}

connect();
</script>
</body>
</html>
